{# example: Preview | height=440 #}
<pb-ui.card class="w-full max-w-sm">
  <pb-ui.card-header>
    <pb-ui.card-title>Create project</pb-ui.card-title>
    <pb-ui.card-description>Deploy your new project in one click.</pb-ui.card-description>
  </pb-ui.card-header>
  <pb-ui.card-content class="grid gap-4">
    <div class="grid gap-2">
      <label class="text-sm font-medium" for="name">Name</label>
      <input id="name" placeholder="My application" class="h-9 rounded-md border bg-transparent px-3 text-sm shadow-xs outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50" />
    </div>
  </pb-ui.card-content>
  <pb-ui.card-footer class="flex justify-between">
    <button class="h-9 rounded-md border px-4 text-sm">Cancel</button>
    <button class="h-9 rounded-md bg-primary px-4 text-sm text-primary-foreground">Deploy</button>
  </pb-ui.card-footer>
</pb-ui.card>
{# example: With an action | height=300 #}
<pb-ui.card class="w-full max-w-sm">
  <pb-ui.card-header>
    <pb-ui.card-title>Notifications</pb-ui.card-title>
    <pb-ui.card-description>You have 3 unread messages.</pb-ui.card-description>
    <pb-ui.card-action><a href="#" class="text-sm underline-offset-4 hover:underline">View all</a></pb-ui.card-action>
  </pb-ui.card-header>
  <pb-ui.card-content class="text-sm text-muted-foreground">Your subscription expires in 3 days.</pb-ui.card-content>
</pb-ui.card>
