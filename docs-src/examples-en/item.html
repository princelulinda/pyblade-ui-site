{# example: Preview | height=320 #}
<div class="grid w-full max-w-md gap-4">
  <pb-ui.item variant="outline">
    <pb-ui.item-content>
      <pb-ui.item-title>Two-factor authentication</pb-ui.item-title>
      <pb-ui.item-description>Verify your identity by email or phone.</pb-ui.item-description>
    </pb-ui.item-content>
    <pb-ui.item-actions><pb-ui.button size="sm" variant="outline">Enable</pb-ui.button></pb-ui.item-actions>
  </pb-ui.item>
  <pb-ui.item variant="muted" size="sm">
    <pb-ui.item-media variant="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></pb-ui.item-media>
    <pb-ui.item-content><pb-ui.item-title>Your profile has been verified.</pb-ui.item-title></pb-ui.item-content>
  </pb-ui.item>
</div>
{# example: List | height=360 #}
<pb-ui.item-group class="w-full max-w-md divide-y rounded-lg border">
  @for(p in people)
  <pb-ui.item>
    <pb-ui.item-media><pb-ui.avatar :fallback="p.initials" class="size-10" /></pb-ui.item-media>
    <pb-ui.item-content>
      <pb-ui.item-title>{{ p.name }}</pb-ui.item-title>
      <pb-ui.item-description>{{ p.email }}</pb-ui.item-description>
    </pb-ui.item-content>
    <pb-ui.item-actions><pb-ui.button variant="ghost" size="sm">Invite</pb-ui.button></pb-ui.item-actions>
  </pb-ui.item>
  @endfor
</pb-ui.item-group>
