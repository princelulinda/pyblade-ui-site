{# example: Preview | height=420 #}
<pb-ui.dialog name="delete">
  <pb-slot:trigger><pb-ui.button variant="outline">Delete account</pb-ui.button></pb-slot:trigger>
  <pb-ui.dialog-header>
    <pb-ui.dialog-title>Are you sure?</pb-ui.dialog-title>
    <pb-ui.dialog-description>This action cannot be undone. Your account and your data will be deleted.</pb-ui.dialog-description>
  </pb-ui.dialog-header>
  <pb-ui.dialog-footer>
    <pb-ui.dialog-close><pb-ui.button variant="outline">Cancel</pb-ui.button></pb-ui.dialog-close>
    <pb-ui.button variant="destructive">Delete</pb-ui.button>
  </pb-ui.dialog-footer>
</pb-ui.dialog>
{# example: Opened by name | height=420 #}
<pb-ui.button variant="secondary" x-data x-on:click="$dispatch('dialog-open', 'welcome')">Open from anywhere</pb-ui.button>
<pb-ui.dialog name="welcome">
  <pb-ui.dialog-header>
    <pb-ui.dialog-title>Welcome</pb-ui.dialog-title>
    <pb-ui.dialog-description>This dialog was opened with $dispatch('dialog-open', 'welcome').</pb-ui.dialog-description>
  </pb-ui.dialog-header>
</pb-ui.dialog>
