{# example: Preview | height=360 #}
<pb-ui.menubar>
  <pb-ui.menubar-menu>
    <pb-ui.menubar-trigger>File</pb-ui.menubar-trigger>
    <pb-ui.menubar-content>
      <pb-ui.menubar-item>New tab <pb-ui.menubar-shortcut>⌘T</pb-ui.menubar-shortcut></pb-ui.menubar-item>
      <pb-ui.menubar-item>New window <pb-ui.menubar-shortcut>⌘N</pb-ui.menubar-shortcut></pb-ui.menubar-item>
      <pb-ui.menubar-separator />
      <pb-ui.menubar-item>Print… <pb-ui.menubar-shortcut>⌘P</pb-ui.menubar-shortcut></pb-ui.menubar-item>
    </pb-ui.menubar-content>
  </pb-ui.menubar-menu>
  <pb-ui.menubar-menu>
    <pb-ui.menubar-trigger>Edit</pb-ui.menubar-trigger>
    <pb-ui.menubar-content>
      <pb-ui.menubar-item>Cancel <pb-ui.menubar-shortcut>⌘Z</pb-ui.menubar-shortcut></pb-ui.menubar-item>
      <pb-ui.menubar-item>Redo <pb-ui.menubar-shortcut>⇧⌘Z</pb-ui.menubar-shortcut></pb-ui.menubar-item>
      <pb-ui.menubar-separator />
      <pb-ui.menubar-item>Cut</pb-ui.menubar-item>
      <pb-ui.menubar-item>Copy</pb-ui.menubar-item>
      <pb-ui.menubar-item>Paste</pb-ui.menubar-item>
    </pb-ui.menubar-content>
  </pb-ui.menubar-menu>
  <pb-ui.menubar-menu>
    <pb-ui.menubar-trigger>View</pb-ui.menubar-trigger>
    <pb-ui.menubar-content>
      <pb-ui.menubar-label>Appearance</pb-ui.menubar-label>
      <pb-ui.menubar-item inset>Full screen</pb-ui.menubar-item>
      <pb-ui.menubar-item inset>Hide sidebar</pb-ui.menubar-item>
    </pb-ui.menubar-content>
  </pb-ui.menubar-menu>
</pb-ui.menubar>
