{# example: Preview | height=360 #}
<pb-ui.scroll-area class="h-72 w-48 rounded-md border">
  <div class="p-4">
    <h4 class="mb-4 text-sm leading-none font-medium">Tags</h4>
    @for(tag in tags)
    <div class="text-sm">{{ tag }}</div>
    <pb-ui.separator class="my-2" />
    @endfor
  </div>
</pb-ui.scroll-area>
{# example: Horizontal | height=260 #}
<pb-ui.scroll-area class="w-full max-w-md rounded-md border whitespace-nowrap">
  <div class="flex w-max gap-4 p-4">
    @for(tag in tags)
    <div class="grid h-32 w-36 shrink-0 place-items-center rounded-md bg-muted text-sm">{{ tag }}</div>
    @endfor
  </div>
</pb-ui.scroll-area>
