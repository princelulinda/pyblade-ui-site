{# example: Preview #}
<pb-ui.alert class="max-w-md">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <pb-ui.alert-title>Changes saved</pb-ui.alert-title>
  <pb-ui.alert-description>Your profile has been updated.</pb-ui.alert-description>
</pb-ui.alert>
{# example: Variants | height=380 #}
<div class="grid w-full max-w-md gap-3">
  <pb-ui.alert variant="destructive">
    <pb-ui.alert-title>Error</pb-ui.alert-title>
    <pb-ui.alert-description>Your session has expired. Please log in again.</pb-ui.alert-description>
  </pb-ui.alert>
  <pb-ui.alert variant="warning">
    <pb-ui.alert-title>Heads up</pb-ui.alert-title>
    <pb-ui.alert-description>You are close to your usage limit.</pb-ui.alert-description>
  </pb-ui.alert>
  <pb-ui.alert variant="success">
    <pb-ui.alert-title>Success</pb-ui.alert-title>
    <pb-ui.alert-description>Your payment has been accepted.</pb-ui.alert-description>
  </pb-ui.alert>
</div>
