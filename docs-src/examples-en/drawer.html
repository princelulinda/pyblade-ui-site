{# example: Preview | height=460 #}
<pb-ui.drawer>
  <pb-slot:trigger><pb-ui.button variant="outline">Open drawer</pb-ui.button></pb-slot:trigger>
  <div class="mx-auto w-full max-w-sm">
    <pb-ui.drawer-header>
      <pb-ui.drawer-title>Daily goal</pb-ui.drawer-title>
      <pb-ui.drawer-description>Drag the handle down to close.</pb-ui.drawer-description>
    </pb-ui.drawer-header>
    <div class="flex items-center justify-center gap-4 p-4" x-data="{ goal: 350 }">
      <pb-ui.button variant="outline" size="icon" class="rounded-full" x-on:click="goal = Math.max(200, goal - 10)" aria-label="Decrease">−</pb-ui.button>
      <div class="text-center"><div class="text-6xl font-bold tracking-tighter" x-text="goal"></div><div class="text-xs text-muted-foreground uppercase">calories / day</div></div>
      <pb-ui.button variant="outline" size="icon" class="rounded-full" x-on:click="goal = Math.min(500, goal + 10)" aria-label="Increase">+</pb-ui.button>
    </div>
    <pb-ui.drawer-footer>
      <pb-ui.button>Submit</pb-ui.button>
      <pb-ui.drawer-close><pb-ui.button variant="outline" class="w-full">Cancel</pb-ui.button></pb-ui.drawer-close>
    </pb-ui.drawer-footer>
  </div>
</pb-ui.drawer>
