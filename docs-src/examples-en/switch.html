{# example: Preview #}
<div class="flex items-center gap-2">
  <pb-ui.switch id="airplane" />
  <pb-ui.label for="airplane">Airplane mode</pb-ui.label>
</div>
{# example: In a form | height=300 #}
<div class="w-full max-w-md space-y-3">
  <div class="flex items-center justify-between rounded-lg border p-4">
    <div class="space-y-0.5">
      <pb-ui.label for="marketing">Marketing emails</pb-ui.label>
      <p class="text-sm text-muted-foreground">News and offers.</p>
    </div>
    <pb-ui.switch id="marketing" />
  </div>
  <div class="flex items-center justify-between rounded-lg border p-4">
    <div class="space-y-0.5">
      <pb-ui.label for="security">Security alerts</pb-ui.label>
      <p class="text-sm text-muted-foreground">Unusual sign-ins.</p>
    </div>
    <pb-ui.switch id="security" checked />
  </div>
</div>
