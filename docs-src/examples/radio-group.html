{# example: Aperçu #}
<pb-ui.radio-group>
  <label class="flex items-center gap-3 text-sm"><pb-ui.radio-group-item name="density" value="default" /> Par défaut</label>
  <label class="flex items-center gap-3 text-sm"><pb-ui.radio-group-item name="density" value="comfortable" checked /> Confortable</label>
  <label class="flex items-center gap-3 text-sm"><pb-ui.radio-group-item name="density" value="compact" /> Compact</label>
</pb-ui.radio-group>
{# example: Cartes de choix | height=320 #}
<pb-ui.radio-group class="w-full max-w-sm">
  <label class="flex cursor-pointer items-start gap-3 rounded-lg border p-4 has-[:checked]:border-primary has-[:checked]:bg-primary/5">
    <pb-ui.radio-group-item name="plan" value="starter" class="mt-0.5" checked />
    <div class="grid gap-1"><span class="text-sm font-medium">Starter</span><span class="text-sm text-muted-foreground">Pour les projets personnels.</span></div>
  </label>
  <label class="flex cursor-pointer items-start gap-3 rounded-lg border p-4 has-[:checked]:border-primary has-[:checked]:bg-primary/5">
    <pb-ui.radio-group-item name="plan" value="pro" class="mt-0.5" />
    <div class="grid gap-1"><span class="text-sm font-medium">Pro</span><span class="text-sm text-muted-foreground">Pour les équipes qui grandissent.</span></div>
  </label>
</pb-ui.radio-group>
