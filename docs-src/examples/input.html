{# example: Aperçu #}
<pb-ui.input type="email" placeholder="Email" class="max-w-sm" />
{# example: Avec un libellé #}
<div class="grid w-full max-w-sm gap-2">
  <pb-ui.label for="email">Email</pb-ui.label>
  <pb-ui.input id="email" type="email" placeholder="vous@exemple.com" />
</div>
{# example: Avec un bouton #}
<div class="flex w-full max-w-sm gap-2">
  <pb-ui.input type="email" placeholder="Email" />
  <pb-ui.button>S'abonner</pb-ui.button>
</div>
{# example: Désactivé #}
<pb-ui.input placeholder="Désactivé" disabled class="max-w-sm" />
